<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order confirmed</title>
<link rel="stylesheet" href="/static/css/store.css">
</head>
<body>
<header class="top">
  <div class="logo"><a href="/" style="color:inherit"><span class="brandname">STORE</span></a></div>
  <div class="tagline" id="tagline"></div>
</header>
<main>
  <div class="notice">
    <h2>Order confirmed. Thanks!</h2>
    <p id="fulfill-lead">Your payment went through.</p>
    <p id="fulfill-status" style="margin-top:.6rem;color:var(--muted)">Completing your order…</p>
  </div>
  <p><a href="/">← Back to the store</a></p>
</main>
<script>
fetch('/api/brand').then(r => r.json()).then(b => {
  document.querySelectorAll('.brandname').forEach(e => e.textContent = b.name);
  document.title = 'Order confirmed — ' + b.name;
  const t = b.theme, r = document.documentElement.style;
  Object.entries({bg:t.bg,bg2:t.bg2,card:t.card,accent:t.accent,accent2:t.accent2,text:t.text,muted:t.muted})
    .forEach(([k,v]) => r.setProperty('--'+k, v));
});
const sid = new URLSearchParams(location.search).get('session_id');
const lead = document.getElementById('fulfill-lead');
const status = document.getElementById('fulfill-status');
if (sid) {
  fetch('/api/fulfill?session_id=' + encodeURIComponent(sid))
    .then(r => r.json().then(j => ({ok: r.ok, j})))
    .then(({ok, j}) => {
      if (ok && j.sportroots && j.sportroots.status) {
        lead.textContent = 'Your payment went through.';
        status.textContent = j.sportroots.status === 'trialing'
          ? 'Your 30-day free trial has started. Manage or cancel anytime from the pricing page.'
          : 'Your SportRoots plan is active. Manage or cancel anytime from the pricing page.';
      } else if (ok && j.digital) {
        lead.textContent = 'Your payment went through.';
        status.textContent = 'Your download is on its way — we emailed your secure download link just now. It stays valid for 7 days, so check your inbox (and spam folder, just in case).';
      } else if (ok) {
        lead.textContent = 'Your payment went through and your gear is headed to the printer.';
        status.textContent = 'Fulfillment order #' + j.printful_order_id + ' submitted — Printful is printing your gear.';
      } else {
        status.textContent = 'Fulfillment note: ' + (j.error || 'pending');
      }
    })
    .catch(e => { status.textContent = 'Fulfillment note: ' + e.message; });
} else {
  status.textContent = '';
}
localStorage.removeItem('pushrod_cart');
</script>
</body>
</html>
