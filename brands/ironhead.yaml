# Brand #3 — IRONHEAD storefront (brand id: ironhead)
# Serves the IronHead motorcycle lines (guides + parts); catalogs are
# built during Slice-5 provisioning — this file deliberately points at
# repo-relative catalog files that do not exist yet, so the service is
# NOT deployable until the IH catalog is stocked (see AUCTIONS env
# checklist in the Slice-4 report). Same codebase as pushrod; select
# with BRAND=ironhead.
brand:
  id: ironhead
  name: IronHead
  tagline: "Vintage iron, kept running"
  # SKU prefixes this brand store serves. Gateway routes shoppers here
  # when the SKU starts with one of these.
  sku_prefixes:
    - "IH-"
  # Unified-catalog ownership: which brand owns each prefix (for the 4-door gateway)
  ownership:
    "PR-": pushrod
    "IH-": ironhead

theme:
  bg: "#14100d"
  bg2: "#1c1611"
  card: "#241b15"
  accent: "#c8402a"      # iron red
  accent2: "#e8a020"     # shop gold
  text: "#f0e9d8"        # warm off-white
  muted: "#a89c8c"
  font_display: "'Arial Black','Helvetica Neue',sans-serif"
  font_body: "'Helvetica Neue',Arial,sans-serif"

# Catalog sources of truth (never edited by the store — read-only).
# PLACEHOLDER: the IH catalog (guides + parts) is stocked in Slice 5;
# until data/ironhead-catalog.csv and data/ironhead-prices.json exist,
# booting this brand fails fast at catalog load by design.
catalog:
  catalogs:
    - csv: "data/ironhead-catalog.csv"
      prices_json: "data/ironhead-prices.json"
  image_base: "/img"     # served from static/img

# Pricing policy: ONLY prices confirmed in the library's price list are sellable.
# SKUs with no price are listed as "Price TBD" and cannot be added to cart.
# Never invent prices.
pricing:
  allow_draft_prices: true
  draft_label: "Intro price"

store:
  currency: usd  # Order idempotency prefix for Printful external_id (per-brand).
  order_prefix: "ih"
  # Stripe: TEST MODE ONLY until the live gate. Live keys are refused in
  # test-named env vars at runtime (see app.py). Separate key set per
  # brand so IH fulfillment and accounting stay isolated.
  stripe_secret_key_env: "IH_STRIPE_TEST_SECRET_KEY"
  stripe_publishable_key_env: "IH_STRIPE_TEST_PUBLISHABLE_KEY"
  stripe_webhook_secret_env: "IH_STRIPE_WEBHOOK_SECRET"
  # Printful: separate token per brand (see README for generation steps).
  printful_api_key_env: "IH_PRINTFUL_API_TOKEN"
  # Printful: REAL API v2 client (backend/fulfillment/printful_client.py).
  # PRINTFUL_DRY_RUN=1 is an offline-dev escape hatch only, never the default.
  printful_api_key_env: "PRINTFUL_API_TOKEN"
  printful_dry_run: false

# Auction engine (auction-engine-spec §1; backend/auctions.py). The IH
# Render service opts in here; auctions stay dark until the test gate
# passes and the first lot is deliberately taken live (never by default).
auctions:
  enabled: true
  brand_code: "IH"
