# Brand #4 — SKILLFORGE AI storefront (brand id: skillforge)
# AI playbooks for trades and service businesses. DIGITAL-ONLY brand:
# every product is a PDF delivered after payment — no Printful, no shipping.
# Same codebase as pushrod/restorationessentials; select with BRAND=skillforge.
brand:
  id: skillforge
  name: SkillForge AI
  tagline: "AI playbooks for people who work with their hands"
  # SKU prefixes this brand store serves.
  sku_prefixes:
    - "SF-"
    # RE guide PDFs (checkout migration Lane 1, 2026-10-02 — Bill: "Already
    # on render stay there": NO separate RE service; the guide library rides
    # THIS service). Every RE-GD- row ships listed=0 (dark): loaded so the
    # token-gated /download + checkout machinery can resolve the SKUs, but
    # never listed, never purchasable, until the lane gate flips rows.
    - "RE-GD-"
    # EverReady Family (checkout migration, 2026-10-02 — Bill: EverReady
    # files move onto the Render store too, same as the guides, superseding
    # the 2026-09-19 per-buyer Drive-share decision). Every ER- row ships
    # listed=0 (dark) and fulfills through the same token-gated /download
    # path — see data/everready-catalog.csv.
    - "ER-"
    # IronHead guides (checkout migration Lane 2, 2026-10-03 — Bill: "Already
    # on render stay there": NO separate IH service; the guide library rides
    # THIS service like RE/ER). Every IH- row ships listed=0 (dark): loaded
    # so the token-gated /download + checkout machinery can resolve the
    # SKUs, but never listed, never purchasable, until the lane gate flips
    # rows — see data/ironhead-catalog.csv + data/ih-digital-sources.json.
    - "IH-"
    # Stitchfolk patterns (checkout migration Lane 3, 2026-10-03 — patterns
    # ride THIS service like RE/ER/IH; Etsy stays its own channel and is
    # untouched). Every ST- row ships listed=0 (dark) until the lane gate
    # flips rows — see data/stitchfolk-catalog.csv.
    - "ST-"
  # Unified-catalog ownership: which brand owns each prefix (gateway routing).
  ownership:
    "PR-": pushrod
    "RE-MC-": restorationessentials
    "RE-CT-": restorationessentials
    "RE-MP-": restorationessentials
    "RE-GD-": restorationessentials
    "ER-": everready
    "IH-": ironhead
    "ST-": stitchfolk
    "SF-": skillforge

theme:
  bg: "#0e1319"          # graphite
  bg2: "#131a21"
  card: "#1b242e"
  accent: "#2dd4bf"      # teal — distinct from pushrod amber and RE shop gold/red
  accent2: "#56ccf2"     # sky
  text: "#edf2f4"
  muted: "#93a1ad"
  font_display: "'Arial Black','Helvetica Neue',sans-serif"
  font_body: "'Helvetica Neue',Arial,sans-serif"

# Catalog sources of truth (never edited by the store — read-only).
# Relative paths resolve against the project root (see backend/app.py).
# Products/csv rows carry delivery_file = the local PDF delivered on payment;
# design_file carries the same PDF basename (cover art is a frontend concern;
# the delivery_file column is the fulfillment source of truth).
catalog:
  catalogs:
    - csv: "data/skillforge-catalog.csv"
      prices_json: "data/skillforge-prices.json"
    # Lane 1 RE guide catalog: 383 staged rows, ALL listed=0 (dark) — see
    # the sku_prefixes note above. Deliverables are NOT in git: they live
    # in the digital-files dir (DIGITAL_FILES_DIR; on this service a
    # persistent disk) under their PDF basenames — data/re-digital-sources.json
    # is the staging work order (358 matched files, 25 gap rows with no
    # deliverable stay unpurchasable even after any flip).
    - csv: "data/re-catalog.csv"
      prices_json: "data/re-prices.json"
    # EverReady catalog: 9 canonical rows, ALL listed=0 (dark) — see the
    # sku_prefixes note above. Deliverables live on the same disk under
    # their PDF basenames (~/workspace/your_files/business/
    # everready-digital-files-sha256-2026-10-02.txt is the manifest);
    # rows with no finished file (or the manual per-family service) stay
    # unpurchasable even after any flip.
    - csv: "data/everready-catalog.csv"
      prices_json: "data/everready-prices.json"
    # IronHead guide catalog (Lane 2): 7 seeded rows from the canonical
    # lineup, ALL listed=0 (dark). First-wave deliverables (4 hero guides
    # + Shovelhead buyer's guide) live on this service's disk under their
    # delivery basenames — data/ih-digital-sources.json is the staging
    # work order. The six-pack and full-catalog pass carry no deliverable
    # until their component guides stage in later waves.
    - csv: "data/ironhead-catalog.csv"
      prices_json: "data/ironhead-prices.json"
    # Stitchfolk pattern catalog (Lane 3): 10 wave-1 rows, ALL listed=0
    # (dark). Deliverables live on this service's disk under their PDF
    # basenames (sha256 manifest: stitchfolk-wave1-disk-verification-2026-10-03.md).
    - csv: "data/stitchfolk-catalog.csv"
      prices_json: "data/stitchfolk-prices.json"
  image_base: "/img"

# Pricing policy: ONLY verified prices are sellable. Live PDP price verified
# 2026-10-02 for the $37 trade shelf (see data/skillforge-prices.json
# pricing_status for per-product provenance). SKUs with no verified price are
# listed as "Price TBD" and cannot be added to cart. Never invent prices.
pricing:
  allow_draft_prices: true
  draft_label: "Intro price"

# Fulfillment: DIGITAL ONLY. On checkout.session.completed the delivery seam
# (backend/fulfillment/digital.py — backend lane) emails/serves the PDF named
# by the catalog row's delivery_file. Printful is NOT used by this brand; the
# printful fields below exist only for schema parity with the merch brands and
# must never be wired to a live order for SkillForge.
fulfillment:
  mode: digital
  delivery: "signed download link + email on payment (backend lane)"

store:
  currency: usd
  # Order idempotency prefix (per-brand).
  order_prefix: "sf"
  # Stripe: TEST MODE ONLY for the pilot. Key must start with sk_test_; live
  # keys are refused at runtime (see backend/app.py). The live flip is a
  # later, separately gated step — do not rename these envs early.
  # No stripe_connect_account_id_env: SkillForge charges the master Stripe
  # account directly (no Connect header).
  stripe_secret_key_env: "SKILLFORGE_STRIPE_TEST_SECRET_KEY"
  stripe_publishable_key_env: "SKILLFORGE_STRIPE_TEST_PUBLISHABLE_KEY"
  stripe_webhook_secret_env: "SKILLFORGE_STRIPE_WEBHOOK_SECRET"
  # UNUSED for this digital brand — schema parity only. Never fulfill a
  # SkillForge order through Printful.
  printful_api_key_env: "SKILLFORGE_PRINTFUL_API_TOKEN"
  printful_dry_run: false
