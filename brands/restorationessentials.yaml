# Brand #2 — RESTORATIONESSENTIALS storefront (brand id: restorationessentials)
# Serves the three RE SKU lines: RE-MC-*, RE-CT-*, RE-MP-* (480 SKUs).
# Same codebase as pushrod; select with BRAND=restorationessentials.
brand:
  id: restorationessentials
  name: Restoration Essentials
  tagline: "Restoration guides for muscle cars & classic trucks"
  # SKU prefixes this brand store serves. Gateway routes shoppers here when
  # the SKU starts with one of these.
  sku_prefixes:
    - "RE-MC-"
    - "RE-CT-"
    - "RE-MP-"
    # RE guide PDFs (checkout migration Lane 1, 2026-10-02). The prefix is
    # claimed so the staged guide catalog (data/re-catalog.csv) loads under
    # this brand — but every guide row ships listed=0 (dark): not listed,
    # not purchasable, until the lane gate (object-storage upload + service
    # bring-up + $29.95 test purchase) flips rows visible.
    - "RE-GD-"
  # Unified-catalog ownership: which brand owns each prefix (for the 4-door gateway)
  ownership:
    "PR-": pushrod
    "RE-MC-": restorationessentials
    "RE-CT-": restorationessentials
    "RE-MP-": restorationessentials
    "RE-GD-": restorationessentials

theme:
  bg: "#101418"
  bg2: "#161c22"
  card: "#1c242d"
  accent: "#e8a020"      # shop gold
  accent2: "#b33030"      # barn red
  text: "#f0e9d8"        # warm off-white
  muted: "#9aa3ab"
  font_display: "'Arial Black','Helvetica Neue',sans-serif"
  font_body: "'Helvetica Neue',Arial,sans-serif"

# Catalog sources of truth (never edited by the store — read-only).
# Multiple sources merge into one unified catalog; SKU collisions across
# sources are a hard error at startup.
catalog:
  catalogs:
    - csv: "/home/hatch/workspace/your_files/re-merch/muscle-cars/catalog-index.csv"
      prices_json: "/home/hatch/workspace/your_files/re-merch/muscle-cars/wholesale-catalog.json"
    - csv: "/home/hatch/workspace/your_files/re-merch/modern-performance/catalog-index.csv"
      prices_json: "/home/hatch/workspace/your_files/re-merch/modern-performance/wholesale-catalog.json"
    - csv: "/home/hatch/workspace/your_files/re-merch/classic-trucks/catalog-index.csv"
      prices_json: "/home/hatch/workspace/your_files/re-merch/classic-trucks/wholesale-catalog.json"
    # Lane 1 guide catalog (2026-10-02): 385 guide rows, all
    # listed=0 (dark). Deliverables live in private object storage, NOT in
    # git — see data/re-digital-sources.json (upload work order) and
    # backend/fulfillment/storage.py.
    - csv: "data/re-catalog.csv"
      prices_json: "data/re-prices.json"
  image_base: "/img"     # served from static/img -> re-merch symlinks

# Pricing policy: ONLY prices confirmed in the library's price list are sellable.
# SKUs with no price are listed as "Price TBD" and cannot be added to cart.
# Never invent prices.
pricing:
  allow_draft_prices: true
  draft_label: "Intro price"

store:
  currency: usd  # Order idempotency prefix for Printful external_id (per-brand).
  order_prefix: "re"
  # Stripe: TEST MODE ONLY in v1. Key must start with sk_test_. Live keys are
  # refused at runtime (see app.py). Separate key set per brand so RE
  # fulfillment and accounting stay isolated from PUSHROD.
  stripe_secret_key_env: "RE_STRIPE_TEST_SECRET_KEY"
  stripe_publishable_key_env: "RE_STRIPE_TEST_PUBLISHABLE_KEY"
  stripe_webhook_secret_env: "RE_STRIPE_WEBHOOK_SECRET"
  # Printful: separate token per brand (see README for generation steps).
  printful_api_key_env: "RE_PRINTFUL_API_TOKEN"
  # Printful: REAL API v2 client (backend/fulfillment/printful_client.py).
  # Token from PRINTFUL_API_TOKEN env var — generate in the Printful dashboard:
  # printful.com -> Stores -> your store -> Settings -> API. Fulfillment is
  # dead without it; the client raises a clear error naming these steps.
  # PRINTFUL_DRY_RUN=1 is an offline-dev escape hatch only, never the default.
  printful_api_key_env: "PRINTFUL_API_TOKEN"
  printful_dry_run: false

# Fulfillment (per-row fulfillment_type rules; this block documents the mix).
# RE-MC-/RE-CT-/RE-MP- merch is Printful print-on-demand — unchanged.
# RE-GD- guides are DIGITAL: on payment the buyer gets a signed, expiring
# email link to /download/<token>, and the bytes stream from private object
# storage (backend/fulfillment/storage.py; DIGITAL_STORAGE_BACKEND=s3 on the
# service). Guide rows stay listed=0 (dark) until the Lane 1 gate closes.
fulfillment:
  mode: mixed
  delivery: "print via Printful (merch); signed download link + email (guides)"

# Auction engine (auction-engine-spec §1; backend/auctions.py). The RE Render
# service opts in here; auctions stay dark until the test gate passes and the
# first lot is deliberately taken live (never by default).
auctions:
  enabled: true
  brand_code: "RE"
